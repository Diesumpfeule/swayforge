# swayforge app catalogue
#
# Source priority: 1. Fedora repos  2. RPM Fusion / COPR / vendor RPM repo  3. Flatpak.
# Flatpak only where there is no maintained RPM – the installer marks those [Flatpak].
#
# Fields per item:
#   id        unique name (stored in your profile)
#   label     display name
#   desc      short description
#   default   ticked by default?
#   locked    always installed, can't be unticked (base desktop)
#   dnf       Fedora packages
#   flatpak   Flathub IDs
#   copr      COPR repo enabled first
#   needs     other items pulled in automatically (e.g. rpmfusion)
#   pre/post  commands before/after ({user}, {fedora}, {app} are replaced)
#   when      "amd" | "laptop" | "bluetooth" – only suggested when detected
#
# Your own items: create ~/.config/swayforge/catalog.toml with the same structure;
# groups with the same id are merged.

[[group]]
id = "system"
label = "System"

  [[group.items]]
  id = "dnf-defaultyes"
  label = "Enter = yes in dnf"
  desc = "[y/N] becomes [Y/n]: Enter confirms (also when removing – read before you press it)"
  default = true
  pre = ["sudo dnf config-manager setopt defaultyes=True"]

  [[group.items]]
  id = "dnf-speed"
  label = "Faster downloads (dnf)"
  desc = "10 parallel downloads instead of 3"
  default = true
  pre = ["sudo dnf config-manager setopt max_parallel_downloads=10"]

  [[group.items]]
  id = "rpmfusion"
  label = "RPM Fusion (free + nonfree)"
  desc = "Needed for Steam, Discord, codecs and AMD video acceleration"
  default = true
  pre = [
    "curl -fsSL -o /tmp/rpmfusion-free.rpm https://mirrors.rpmfusion.org/free/fedora/rpmfusion-free-release-{fedora}.noarch.rpm",
    "curl -fsSL -o /tmp/rpmfusion-nonfree.rpm https://mirrors.rpmfusion.org/nonfree/fedora/rpmfusion-nonfree-release-{fedora}.noarch.rpm",
    "sudo dnf install -y /tmp/rpmfusion-free.rpm /tmp/rpmfusion-nonfree.rpm",
    "sudo dnf config-manager setopt rpmfusion-free-updates-testing.enabled=0 rpmfusion-nonfree-updates-testing.enabled=0 || true",
  ]

  [[group.items]]
  id = "flathub"
  label = "Flathub"
  desc = "Only for apps without an RPM – pulled in automatically when you pick one"
  default = false
  dnf = ["flatpak"]
  post = ["sudo flatpak remote-add --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo"]

  [[group.items]]
  id = "codecs"
  label = "Multimedia codecs"
  desc = "Full ffmpeg instead of ffmpeg-free (videos, streams, OBS)"
  default = true
  needs = ["rpmfusion"]
  post = ["sudo dnf swap -y --allowerasing ffmpeg-free ffmpeg"]

  [[group.items]]
  id = "amd-video"
  label = "AMD video acceleration"
  desc = "Mesa freeworld: hardware decoding of H.264/H.265 on AMD"
  default = true
  when = "amd"
  needs = ["rpmfusion"]
  dnf = ["vulkan-tools", "libva-utils"]
  post = [
    "sudo dnf swap -y --allowerasing mesa-va-drivers mesa-va-drivers-freeworld",
    "sudo dnf swap -y --allowerasing mesa-va-drivers.i686 mesa-va-drivers-freeworld.i686 || true",
  ]

  [[group.items]]
  id = "firmware"
  label = "Firmware updates (fwupd)"
  desc = "BIOS/SSD/peripheral updates via fwupdmgr"
  default = true
  dnf = ["fwupd"]

  [[group.items]]
  id = "timeshift"
  label = "Timeshift"
  desc = "System snapshots – roll back a broken update in minutes"
  default = false
  dnf = ["timeshift"]

  [[group.items]]
  id = "bluetooth"
  label = "Bluetooth"
  desc = "Enable the service + Blueman as a fallback GUI"
  default = true
  when = "bluetooth"
  dnf = ["blueman", "bluez"]
  post = ["sudo systemctl enable --now bluetooth"]

  [[group.items]]
  id = "cleanup-tools"
  label = "Cleanup tools (BleachBit, ncdu)"
  desc = "BleachBit clears caches and app leftovers · ncdu shows what fills your disk – both in Settings → Cleanup"
  default = false
  dnf = ["bleachbit", "ncdu"]

