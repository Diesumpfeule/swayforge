    "xdg-desktop-portal-wlr", "xdg-desktop-portal-gtk", "lxqt-policykit", "wlr-randr", "xrandr", "exfatprogs", "dosfstools",
    "papirus-icon-theme", "adw-gtk3-theme", "librsvg2", "librsvg2-tools",
    "google-noto-emoji-fonts", "jetbrains-mono-fonts-all", "fontconfig",
    "zsh", "zsh-autosuggestions", "zsh-syntax-highlighting", "fzf", "zoxide",
    "git", "curl", "unzip", "tar", "xz", "btop", "fastfetch",
    "python3-textual", "python3-jinja2",
  ]

  [[group.items]]
