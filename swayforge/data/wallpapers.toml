# Wallpaper collections swayforge can download on request.
# Nothing here is bundled with swayforge: the pictures are fetched from the original GitHub
# repository onto *your* computer (git sparse checkout – only the folders you choose), straight
# into your Wallpapers folder. Sizes are measured (files / MB), 2026-10.

[[pack]]
id = "dharmx"
name = "dharmx/walls"
repo = "https://github.com/dharmx/walls"
branch = "main"
subdir = ""                 # categories are top-level folders
license = "none stated – images belong to their authors; personal use as wallpaper"
blurb = "Large, well sorted collection: anime, nature, minimal, nord, gruvbox, architecture …"

