<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>swayforge app</title>
<link rel="stylesheet" href="/static/studio.css">
</head>
<body>
<div class="app">
  <nav class="rail" aria-label="Sections">
    <div class="brand" aria-label="swayforge app">
      <canvas id="logo" width="232" height="44" aria-hidden="true"></canvas>
      <span class="brand-sub">settings</span>
    </div>
    <input id="find" type="search" placeholder="Find a setting" aria-label="Find a setting" autocomplete="off">
    <div id="nav" class="navs"></div>
    <figure class="rail-preview" aria-label="Your desktop with the current changes">
      <div class="desk-frame" id="rail-desk"></div>
      <figcaption id="rail-caption"></figcaption>
    </figure>
  </nav>

  <main id="main">
    <header class="top">
      <h1 id="title">Overview</h1>
      <div class="actions">
        <span id="state" class="state" role="status" aria-live="polite"></span>
        <button id="revert" class="btn ghost" disabled>Undo changes</button>
        <button id="apply" class="btn primary" disabled>Apply to desktop</button>
      </div>
    </header>
    <div id="view" class="page"></div>
  </main>
</div>
<div class="toast" id="toast" role="alert" hidden></div>
<dialog id="dlg"><form method="dialog" class="dlg-body" id="dlg-body"></form></dialog>
<script src="/static/desk.js"></script>
<script src="/static/savers.js"></script>
<script src="/static/studio.js"></script>
<script src="/static/pages.js"></script>
</body>
</html>
