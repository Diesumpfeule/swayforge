# Manual check of the kitty image preview with a REAL kitty (Xvfb + software OpenGL), plus a real
# download of one small wallpaper folder. Screenshots go to the branch ci-screenshots-swayforge.
name: Kitty preview check

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  preview:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install kitty, Xvfb, Textual
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq kitty sway grim xvfb imagemagick fonts-dejavu fonts-noto-core mesa-utils libgl1-mesa-dri \
            python3-pip python3-jinja2 python3-pil xdotool
          pip install --break-system-packages textual
          kitty --version; kitten --version
      - name: Real wallpaper download (one small folder)
        run: |
          export HOME=$RUNNER_TEMP/home; mkdir -p $HOME
          python3 -m swayforge wallpapers list | head -5
          python3 -m swayforge wallpapers install dharmx/paper dharmx/wave
          find $HOME/Pictures/Wallpapers -type f | tee downloaded.txt | head -20
          test "$(wc -l < downloaded.txt)" -ge 5
          ls -A $HOME/.cache | grep -c swayforge-walls || true
      - name: Settings app → Wallpapers page inside real kitty
        continue-on-error: true
        run: |
          exec > >(tee step5.log) 2>&1
          export PYTHONUSERBASE=$HOME/.local
          export HOME=$RUNNER_TEMP/home2; mkdir -p $HOME/Pictures/Wallpapers/demo
          i=0; for c in "red-blue" "green-black" "yellow-purple" "white-teal"; do
            i=$((i+1)); convert -size 1920x1080 gradient:$c -swirl 120 $HOME/Pictures/Wallpapers/demo/pic$i.png
          done
          export XDG_RUNTIME_DIR=$RUNNER_TEMP/run; mkdir -p -m 700 $XDG_RUNTIME_DIR
          printf 'output HEADLESS-1 resolution 1400x800\noutput * bg #202030 solid_color\n' > sway.cfg
          WLR_BACKENDS=headless WLR_RENDERER=pixman WLR_LIBINPUT_NO_DEVICES=1 sway -c sway.cfg > sway.log 2>&1 &
          sleep 4
          export WAYLAND_DISPLAY=$(ls $XDG_RUNTIME_DIR | grep -m1 '^wayland-[0-9]$')
          export LIBGL_ALWAYS_SOFTWARE=1 SWAYFORGE_ROOT=$PWD
          unset DISPLAY
          cat > demo.py <<'PY'
          import os, sys
          sys.path.insert(0, os.environ["SWAYFORGE_ROOT"])
          from textual.widgets import OptionList
          from swayforge import kittyimg
          import swayforge.tui.settings_app as sa
          open("/tmp/status.txt", "w").write(repr(kittyimg.status()) + "\n")
          app = sa.SettingsApp(page="wallpapers")
          def pick():
              ol = app.query_one("#wp_files", OptionList)
              ol.focus()
              ol.highlighted = 1
              p = app.query_one("#wp_prev")
              open("/tmp/status.txt", "a").write("picked; preview=%r\n" % (p.message,))
          def report():
              pv = app.query_one("#wp_prev")
              open("/tmp/status.txt", "a").write("placed=%r msg=%r\n" % (bool(pv.placement), pv.message))
          import threading
          threading.Timer(4, lambda: app.call_from_thread(pick)).start()
          threading.Timer(9, lambda: app.call_from_thread(report)).start()
          app.run()
          PY
          kitty --hold --config NONE -o linux_display_server=wayland -o initial_window_width=150c -o initial_window_height=45c \
                -o remember_window_size=no -o font_size=10 -o confirm_os_window_close=0 \
                sh -c 'python3 demo.py 2> demo-err.log' > kitty.log 2>&1 &
          KPID=$!
          sleep 6; grim 1-start.png
          sleep 8
          cat /tmp/status.txt; cp /tmp/status.txt status.txt
          grim 2-after.png
          kill $KPID || true
          kitty --config NONE -o remember_window_size=no -o confirm_os_window_close=0 \
            python3 scripts/check_kitty_graphics.py $HOME/Pictures/Wallpapers/demo/pic1.png $PWD/accept.txt > accept-run.log 2>&1 &
          for i in $(seq 1 20); do test -s accept.txt && break; sleep 1; done
          cat accept.txt
          tail -20 kitty.log demo-err.log
      - name: Raw kitten icat output
        continue-on-error: true
        run: |
          export HOME=$RUNNER_TEMP/home2
          export XDG_RUNTIME_DIR=$RUNNER_TEMP/run
          export WAYLAND_DISPLAY=$(ls $XDG_RUNTIME_DIR | grep -m1 '^wayland-[0-9]$')
          export LIBGL_ALWAYS_SOFTWARE=1; unset DISPLAY
          kitty --config NONE -o remember_window_size=no -o confirm_os_window_close=0 \
            python3 scripts/dump_icat.py $HOME/Pictures/Wallpapers/demo/pic1.png $PWD/icat-raw.txt > dump-run.log 2>&1 &
          for i in $(seq 1 25); do test -s icat-raw.txt && break; sleep 1; done
          cat icat-raw.txt || true
      - name: Share screenshots
        if: always()
        run: |
          mkdir -p /tmp/shots && cp *.png *.log *.txt /tmp/shots/ 2>/dev/null || true; cp /tmp/status.txt /tmp/shots/ 2>/dev/null || true
          git config user.name ci; git config user.email ci@users.noreply.github.com
          git checkout -q --orphan shots
          git rm -rfq --cached . >/dev/null
          git clean -fdxq
          cp /tmp/shots/* .
          git add -A
          git commit -qm "kitty preview screenshots"
          git push -qf origin HEAD:refs/heads/ci-screenshots-swayforge
